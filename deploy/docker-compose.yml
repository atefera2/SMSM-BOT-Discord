services:
  smsm-ops:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: smsm-ops
    restart: unless-stopped
    env_file: ../.env
    environment:
      SMSM_STATE_DIR: /data
      # Generate once:  openssl rand -hex 16
      # Required if port 8080 is reachable from the internet.
      SMSM_DASH_TOKEN: ${SMSM_DASH_TOKEN:-}
    volumes:
      - smsm-data:/data
      # Live-edit the menu without rebuilding:
      - ../config.json:/app/config.json:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,os,sys; k=os.getenv('SMSM_DASH_TOKEN',''); \
              u='http://127.0.0.1:8080/api/state'+('?k='+k if k else ''); \
              sys.exit(0 if urllib.request.urlopen(u,timeout=5).getcode()==200 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  smsm-data:
