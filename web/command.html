<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Command Center — SMSM Festival</title>
<style>
  :root{
    --bg:#0d0d10;--panel:#17171c;--edge:#272730;--txt:#f2f2f5;--dim:#8b8b99;
    --good:#22a35a;--low:#e0a800;--need:#e0342b;--out:#7a1a15;--prep:#2079cc;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:16px}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px}
  h1{font-size:20px;letter-spacing:.06em}
  h1 .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--good);margin-right:8px}
  h1 .dot.dead{background:var(--need);animation:blink .8s infinite}
  @keyframes blink{50%{opacity:.15}}
  .right{display:flex;align-items:center;gap:14px;font-size:13px;color:var(--dim)}
  .clock{font-size:22px;font-weight:800;color:var(--txt);font-variant-numeric:tabular-nums}
  .tally{display:flex;gap:8px}
  .t{padding:5px 11px;border-radius:20px;font-size:12px;font-weight:800;letter-spacing:.05em}
  .t.need{background:var(--need)} .t.out{background:var(--out)}
  .t.low{background:var(--low);color:#1a1400} .t.prepping{background:var(--prep)}
  .t.good{background:#1e2a22;color:var(--good)}
  .layout{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}
  @media(max-width:900px){.layout{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:12px 14px;margin-bottom:14px}
  .panel h2{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--dim);margin-bottom:9px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);padding:4px 6px;font-weight:700}
  td{padding:6px;border-top:1px solid var(--edge);vertical-align:middle}
  tr.need td{background:rgba(224,52,43,.14)}
  tr.out td{background:rgba(122,26,21,.3)}
  tr.low td{background:rgba(224,168,0,.12)}
  tr.prepping td{background:rgba(32,121,204,.14)}
  .nm{font-weight:700}
  .badge{display:inline-block;padding:2px 8px;border-radius:5px;font-size:10px;font-weight:800;letter-spacing:.07em;white-space:nowrap}
  .badge.good{background:#1e2a22;color:var(--good)} .badge.low{background:var(--low);color:#1a1400}
  .badge.need{background:var(--need)} .badge.out{background:var(--out)}
  .badge.prepping{background:var(--prep)} .badge.ready{background:#12403a;color:#3fd9bd}
  .muted{color:var(--dim);font-size:12px}
  .feed{max-height:74vh;overflow:auto}
  .f{padding:8px 0;border-top:1px solid var(--edge);font-size:13px;line-height:1.4}
  .f:first-child{border-top:0}
  .f .w{font-weight:700}
  .f .t2{color:var(--dim);font-size:11px}
  .stationhead td{background:#101014;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:800}
  .urls{font-size:12px;color:var(--dim);line-height:1.9}
  code{background:#000;padding:2px 7px;border-radius:4px;color:#7fd1ff}
</style>
</head>
<body>
<header>
  <h1><span class="dot" id="dot"></span><span id="fest">Command Center</span></h1>
  <div class="right">
    <div class="tally" id="tally"></div>
    <span id="shift"></span>
    <span class="clock" id="clock">--:--</span>
  </div>
</header>

<div class="layout">
  <div>
    <div class="panel"><h2>All items</h2>
      <table><thead><tr><th style="width:34%">Item</th><th>Status</th><th>Detail</th><th>Who</th><th>Updated</th></tr></thead>
      <tbody id="rows"></tbody></table>
    </div>
    <div class="panel"><h2>Screens</h2>
      <div class="urls">
        Kitchen big-text screen &nbsp;<code id="ku">/kitchen</code><br>
        This page &nbsp;<code id="cu">/</code><br>
        <span style="color:#5a5a66">Double-click the kitchen screen to toggle fullscreen. F11 also works.</span>
      </div>
    </div>
  </div>

  <div class="panel"><h2>Live request feed — memory bank</h2>
    <div class="feed" id="feed"></div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
let misses = 0;
const ORDER = {out:0, need:1, low:2, prepping:3, ready:4, good:5};
function esc(s){ return (s||"").replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])); }

async function tick(){
  try{
    const d = await (await fetch('/api/state',{cache:'no-store'})).json();
    misses = 0; $('#dot').classList.remove('dead'); render(d);
  }catch(e){ if(++misses > 3) $('#dot').classList.add('dead'); }
}

function render(d){
  $('#fest').textContent = d.festival + ' — Command Center';
  $('#clock').textContent = d.clock;
  $('#ku').textContent = location.origin + '/kitchen';
  $('#cu').textContent = location.origin + '/';
  $('#shift').textContent = d.on_shift.length ? d.on_shift.length + ' on shift' : '';

  const unclaimed = d.items.filter(i => i.unclaimed && i.waiting >= 5).length;
  const late = d.items.filter(i => i.overdue).length;
  $('#tally').innerHTML =
    (d.muted_minutes > 0 ? `<span class="t low">MUTED ${d.muted_minutes}m</span>` : '') +
    (unclaimed ? `<span class="t need">${unclaimed} UNCLAIMED</span>` : '') +
    (late ? `<span class="t out">${late} LATE</span>` : '') +
    ['out','need','low','prepping','good']
      .filter(k => d.counts[k] > 0)
      .map(k => `<span class="t ${k}">${d.counts[k]} ${k.toUpperCase()}</span>`).join('');

  const byStation = {};
  d.items.forEach(i => (byStation[i.station] ||= []).push(i));
  let html = '';
  for(const [st, items] of Object.entries(byStation)){
    items.sort((a,b) => ORDER[a.level] - ORDER[b.level]);
    html += `<tr class="stationhead"><td colspan="5">${esc(st)}</td></tr>`;
    html += items.map(i => `
      <tr class="${i.level}">
        <td class="nm">${esc(i.name)}${i.screen ? '' : ' <span class="muted">·</span>'}</td>
        <td><span class="badge ${i.level}">${i.label}</span>${
          i.overdue ? ' <span class="badge out">LATE</span>'
          : (i.unclaimed && i.waiting >= 5 ? ` <span class="badge need">${i.waiting}m UNCLAIMED</span>` : '')
        }</td>
        <td class="muted">${esc(i.detail)}${i.eta ? ' <b>'+esc(i.eta)+'</b>' : ''}</td>
        <td class="muted">${esc(i.by)}</td>
        <td class="muted">${i.ago}</td>
      </tr>`).join('');
  }
  $('#rows').innerHTML = html;

  $('#feed').innerHTML = d.feed.map(f => `
    <div class="f">
      <span class="w">${esc(f.who)}</span>
      ${f.level ? `<span class="badge ${f.level}">${esc(f.name)}</span>` : ''}
      <div>${esc(f.text)}</div>
      <div class="t2">${f.ago}</div>
    </div>`).join('') || '<div class="muted">Nothing yet today.</div>';
}
tick(); setInterval(tick, 2000);
</script>
</body>
</html>
